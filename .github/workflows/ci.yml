name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract and check module scripts
        run: python3 .github/scripts/check_modules.py
